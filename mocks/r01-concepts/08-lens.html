<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lens · Concept 08</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
/* Layout: the index itself is the hero. A glass loupe travels over it and shows what each name holds. */
:root{
  --ink:#0B0B0A; --bone:#EEE7DA; --dim:rgba(238,231,218,.45); --hair:rgba(238,231,218,.14);
  --display:'Gloock',ui-serif,Didot,Georgia,serif; --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;font-family:var(--mono)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;touch-action:none}
header{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:baseline;padding:calc(20px + env(safe-area-inset-top,0px)) clamp(16px,3vw,44px) 14px;z-index:2;background:linear-gradient(var(--ink) 55%,transparent)}
.mk{font-family:var(--display);font-size:22px}
nav{display:flex;gap:26px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.info{position:fixed;right:clamp(16px,3vw,44px);bottom:clamp(20px,4vh,40px);z-index:2;width:min(300px,60vw);text-align:right;font-size:11px;line-height:1.6;color:var(--dim)}
.info b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;color:var(--bone);margin-bottom:4px}
.hint{position:fixed;left:clamp(16px,3vw,44px);bottom:clamp(20px,4vh,40px);z-index:2;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.mockbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));font:10px/1.2 ui-monospace,Menlo,monospace;color:#8f8a84;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.08);padding:6px 9px;border-radius:3px;text-decoration:none;z-index:10;white-space:nowrap}
.mockbar b{color:#ece8e2;font-weight:500}
@media (max-width:700px){ nav{display:none} .hint{display:none} .info{bottom:52px;width:auto;left:16px;text-align:left} }
</style>
</head>
<body>
<canvas id="gl" aria-label="An index of 25 project names under a moving glass lens"></canvas>
<header><span class="mk">KiarashFa</span><nav><span>Index</span><span>Families</span><span>About</span><span>Sound ○</span></nav></header>
<div class="hint">Index of works · scroll</div>
<div class="info" id="info"><b>Perceptense</b>Intuition for numbers, scale and systems.</div>
<a class="mockbar" href="../">← concepts · <b>08 Lens</b> · raw WebGL + canvas type</a>

<script type="module">
import { PROJECTS } from './_data.js';
const N = PROJECTS.length;
const cv = document.getElementById('gl'), gl = cv.getContext('webgl2', { antialias: false });
const txt = document.createElement('canvas'), tg = txt.getContext('2d');
const pre = document.createElement('canvas'); pre.width = pre.height = 512; const pg = pre.getContext('2d');
let W, H, dpr, rowH, scroll = 0, scrollT = 0, lens = [0, 0], lensT = [0, 0], mobile = false, sel = -1;

function drawText(){
  const g = tg; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, txt.width, txt.height); g.scale(dpr, dpr);
  const top = 110, fs = rowH * .74, left = mobile ? 16 : W * .12;
  for (let i = 0; i < N; i++) {
    const y = top + i * rowH - scroll; if (y < -rowH || y > H + rowH) continue;
    const p = PROJECTS[i];
    g.fillStyle = 'rgba(238,231,218,.14)'; g.fillRect(mobile ? 16 : W * .03, y + rowH - 1, W - (mobile ? 32 : W * .06), 1);
    g.font = `300 ${mobile ? 9 : 11}px 'DM Mono'`; g.fillStyle = 'rgba(238,231,218,.5)';
    if (!mobile) g.fillText(String(i + 1).padStart(2, '0'), W * .03, y + rowH * .3);
    g.textAlign = 'right'; g.fillText(p.kind.toUpperCase(), W - (mobile ? 16 : W * .03), y + rowH * .3); g.textAlign = 'left';
    g.font = `${fs}px 'Gloock'`;
    if (i % 2) { g.lineWidth = 1.1; g.strokeStyle = p.tier === 3 ? 'rgba(238,231,218,.35)' : '#EEE7DA'; g.strokeText(p.name, left, y + rowH * .82); }
    else { g.fillStyle = p.tier === 3 ? 'rgba(238,231,218,.3)' : '#EEE7DA'; g.fillText(p.name, left, y + rowH * .82); }
  }
}
// stand-in previews; the real site would show a screenshot or a short loop of each project
const HUES = [28, 205, 12, 330, 18, 160, 265, 0, 45, 190];
function drawPreview(i){
  const h = HUES[i % HUES.length], g = pg, S = 512;
  const gr = g.createLinearGradient(0, 0, S, S); gr.addColorStop(0, `hsl(${h} 45% 22%)`); gr.addColorStop(1, `hsl(${(h + 40) % 360} 55% 48%)`);
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  g.globalAlpha = .9; g.strokeStyle = `hsl(${h} 60% 80%)`; g.lineWidth = 2;
  for (let k = 0; k < 14; k++) { g.beginPath(); g.arc(S * .62, S * .58, 20 + k * 22, 0, Math.PI * 2); g.globalAlpha = .5 - k * .03; g.stroke(); }
  g.globalAlpha = 1; g.fillStyle = 'rgba(255,255,255,.92)'; g.fillRect(S * .12, S * .2, S * .42, 10); g.fillRect(S * .12, S * .2 + 22, S * .3, 6); g.fillRect(S * .12, S * .2 + 36, S * .34, 6);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(S * .12, S * .62, S * .36, S * .2);
  gl.bindTexture(gl.TEXTURE_2D, tPre); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pre);
}

const VS = `#version 300 es
in vec2 p; out vec2 v; void main(){ v = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float; in vec2 v; out vec4 o;
uniform sampler2D uTxt, uPre; uniform vec2 uRes, uLens; uniform float uR, uShow;
vec4 T(vec2 uv){ return texture(uTxt, vec2(uv.x, 1.-uv.y)); }
void main(){
  vec2 p = v*uRes; vec2 d = p - uLens; float r = length(d)/uR;
  vec3 ink = vec3(.043,.043,.039), bone = vec3(.933,.906,.855);
  vec3 col = ink + T(v).a*(bone-ink);
  if (r < 1.){
    // barrel magnification, stronger toward the centre
    float k = .52 + .2*r*r;
    vec2 q = uLens + d*k;
    float ca = .006*r*r;                           // chromatic split at the rim
    vec2 dir = normalize(d+1e-4);
    float tr = T((q + dir*ca*uR*3.)/uRes).a, tg = T(q/uRes).a, tb = T((q - dir*ca*uR*3.)/uRes).a;
    vec3 pr = texture(uPre, vec2(d.x, -d.y)/uR*.5*.82 + .5).rgb;
    vec3 under = mix(ink*1.4, pr*.9, uShow);
    col = vec3(under.r + tr*(bone.r-under.r), under.g + tg*(bone.g-under.g), under.b + tb*(bone.b-under.b));
    col *= 1. - .35*smoothstep(.75,1.,r);           // inner shadow
    col += vec3(1.)*pow(max(0., 1.-length(d/uR - vec2(-.42,.5))*1.6), 3.)*.22;   // glint
    col += vec3(1.)*smoothstep(.965,.995,r)*.55;      // bright rim
  } else {
    col *= 1. - .45*exp(-(r-1.)*7.);                // soft shadow cast by the glass
  }
  vec2 q = v; col *= .8 + .2*pow(16.*q.x*q.y*(1.-q.x)*(1.-q.y), .2);
  o = vec4(col,1.);
}`;
function sh(t, s){ const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(x)); return x; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const tex = () => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
const tTxt = tex(), tPre = tex();
const U = n => gl.getUniformLocation(pr, n);
gl.uniform1i(U('uTxt'), 0); gl.uniform1i(U('uPre'), 1);

function resize(){ dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight; mobile = W < 700;
  cv.width = txt.width = W * dpr; cv.height = txt.height = H * dpr; rowH = mobile ? 64 : Math.max(96, H * .17);
  lensT = mobile ? [W * .5, H * .44] : [W * .3, H * .52]; if (!lens[0]) lens = [...lensT]; }
addEventListener('resize', resize); resize();
addEventListener('pointermove', e => { if (!mobile) lensT = [e.clientX, e.clientY]; });
addEventListener('wheel', e => { scrollT += e.deltaY; }, { passive: true });
let ty = null; cv.addEventListener('pointerdown', e => ty = e.clientY); addEventListener('pointerup', () => ty = null);
cv.addEventListener('pointermove', e => { if (mobile && ty !== null) { scrollT -= e.clientY - ty; ty = e.clientY; } });
const info = document.getElementById('info');
let show = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(t){
  scrollT = Math.max(-40, Math.min(scrollT + (reduce ? 0 : .25), N * rowH - H * .6));
  scroll += (scrollT - scroll) * .1;
  lens[0] += (lensT[0] - lens[0]) * .12; lens[1] += (lensT[1] - lens[1]) * .12;
  const row = Math.floor((lens[1] + scroll - 110) / rowH);
  if (row !== sel && row >= 0 && row < N) { sel = row; drawPreview(row); const p = PROJECTS[row]; info.innerHTML = `<b>${p.name}</b>${p.line}.`; show = 0; }
  show += (1 - show) * .06;
  drawText();
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tTxt); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, txt);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tPre);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(U('uRes'), cv.width, cv.height); gl.uniform2f(U('uLens'), lens[0] * dpr, (H - lens[1]) * dpr);
  gl.uniform1f(U('uR'), (mobile ? 92 : Math.min(170, H * .2)) * dpr); gl.uniform1f(U('uShow'), show);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  window.__frames = (window.__frames || 0) + 1;
  requestAnimationFrame(frame);
}
document.fonts.ready.then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
