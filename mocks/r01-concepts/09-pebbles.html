<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pebbles · Concept 09</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&display=swap" rel="stylesheet">
<style>
/* Layout: a bright table top. Stones fall in and pile up; the words stay quiet in the top corners. */
:root{
  --table:#F0EDE7; --ink:#1F1E1B; --muted:#86827A; --lapis:#2F4A7A;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(120% 90% at 50% 20%,#f7f5f1 0%,var(--table) 55%,#e4dfd6 100%);color:var(--ink);overflow:hidden;font-family:var(--display)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
header{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:baseline;padding:calc(22px + env(safe-area-inset-top,0px)) clamp(16px,3vw,44px) 0;z-index:2;pointer-events:none;font-size:14px}
.mk{font-weight:600;font-size:19px;letter-spacing:-.02em;font-variation-settings:'opsz' 96}
nav{display:flex;gap:24px;color:var(--muted)}
.hero{position:fixed;left:clamp(16px,3vw,44px);top:clamp(80px,13vh,130px);z-index:2;pointer-events:none}
.hero h1{font-weight:300;font-size:clamp(52px,8vw,132px);line-height:.9;letter-spacing:-.045em;margin:0;font-variation-settings:'opsz' 96}
.hero h1 b{font-weight:600}
.hero p{margin:16px 0 0;font-size:15px;line-height:1.5;color:var(--muted);max-width:30ch;font-variation-settings:'opsz' 14}
.pick{position:fixed;right:clamp(16px,3vw,44px);top:clamp(80px,13vh,130px);z-index:2;text-align:right;width:min(280px,70vw);pointer-events:none;transition:opacity .4s}
.pick .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pick .n{font-weight:600;font-size:34px;letter-spacing:-.03em;margin:4px 0}
.pick .l{font-size:14px;line-height:1.45;color:var(--muted)}
.pick .go{display:inline-block;margin-top:12px;font-size:13px;font-weight:500;color:var(--lapis)}
.mockbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));font:10px/1.2 ui-monospace,Menlo,monospace;color:#ddd8cf;background:rgba(31,30,27,.86);padding:6px 9px;border-radius:3px;text-decoration:none;z-index:10;white-space:nowrap}
.mockbar b{color:#fff;font-weight:500}
@media (max-width:700px){ nav{display:none} .pick{top:300px;left:16px;right:auto;text-align:left} .pick .l{display:none} .hero p{max-width:22ch;font-size:13px} .mockbar{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px))} }
</style>
</head>
<body>
<canvas id="c" aria-label="Twenty-five engraved stones you can pick up and throw"></canvas>
<header><span class="mk">KiarashFa</span><nav><span>Index</span><span>Families</span><span>About</span><span>Sound ○</span></nav></header>
<section class="hero"><h1>Pick one<br><b>up.</b></h1><p>Twenty-five side projects by Kia, each cut from its own stone. Throw them around. Tap one to open it.</p></section>
<div class="pick" id="pick"><div class="k" id="pk">Lapis · Encyclopedia</div><div class="n" id="pn">PolymerAtlas</div><div class="l" id="pl">The polymers that shaped the modern world.</div><span class="go">Open →</span></div>
<a class="mockbar" href="../">← concepts · <b>09 Pebbles</b> · matter.js physics + Canvas 2D</a>

<script src="../vendor/matter.min.js"></script>
<script type="module">
import { PROJECTS } from './_data.js';
const { Engine, Bodies, Composite, Mouse, MouseConstraint, Body, Events } = Matter;
const STONES = [
  ['Lapis', '#2F4A7A', '#5874a8', '#E9E4D8'], ['Basalt', '#2B2A28', '#4a4844', '#E9E4D8'], ['Jade', '#5F8E77', '#8bb8a0', '#F4F1EA'],
  ['Travertine', '#D6C9B1', '#ece2cd', '#4A4237'], ['Rose quartz', '#E2C2BE', '#f3dcd8', '#5B403C'], ['Slate', '#5F6B76', '#86929c', '#EEF0F0'],
  ['Marble', '#EEEBE4', '#ffffff', '#5A5650'], ['Jasper', '#A65D45', '#c98268', '#F7EDE6'], ['Sand', '#E3CFAD', '#f3e4c8', '#5B4C34'],
];
const cv = document.getElementById('c'), g = cv.getContext('2d');
const engine = Engine.create({ gravity: { y: 1.1 } });
let W, H, dpr, sc, walls = [], stones = [];
function build(){
  dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
  sc = Math.max(.52, Math.min(1, W / 1400));
  Composite.remove(engine.world, walls);
  const t = 200; walls = [Bodies.rectangle(W / 2, H + t / 2, W * 3, t, { isStatic: true }), Bodies.rectangle(-t / 2, H / 2, t, H * 4, { isStatic: true }), Bodies.rectangle(W + t / 2, H / 2, t, H * 4, { isStatic: true })];
  Composite.add(engine.world, walls);
}
build();
PROJECTS.forEach((p, i) => {
  const big = p.tier === 1 ? 1 : p.tier === 2 ? .8 : .62, w = (170 + (i * 37 % 40)) * big * sc, h = (88 + (i * 13 % 18)) * big * sc;
  // a pebble: an ellipse with a slightly irregular, still convex, outline
  const ph1 = i * 1.3, ph2 = i * 2.1, verts = Array.from({ length: 28 }, (_, k) => { const a = k / 28 * Math.PI * 2, r = 1 + .055 * Math.sin(2 * a + ph1) + .03 * Math.sin(3 * a + ph2);
    return { x: Math.cos(a) * w / 2 * r, y: Math.sin(a) * h / 2 * r }; });
  const b = Bodies.fromVertices(W * (.15 + ((i * 0.618) % 1) * .7), -120 - i * 70, [verts], { restitution: .18, friction: .5, frictionAir: .012, density: .002, angle: (i * 1.7) % 1 - .5 });
  b.plugin = { i, w, h, stone: STONES[i % STONES.length] }; stones.push(b);
});
// drop them in one by one
stones.forEach((b, k) => setTimeout(() => Composite.add(engine.world, b), k * 70));
const mouse = Mouse.create(cv); mouse.pixelRatio = 1;
const mc = MouseConstraint.create(engine, { mouse, constraint: { stiffness: .18, damping: .1, render: { visible: false } } });
Composite.add(engine.world, mc);
let down = null;
Events.on(mc, 'mousedown', e => down = { x: e.mouse.position.x, y: e.mouse.position.y, b: mc.body });
Events.on(mc, 'startdrag', e => select(e.body.plugin.i));
Events.on(mc, 'mouseup', e => { if (down && Math.hypot(e.mouse.position.x - down.x, e.mouse.position.y - down.y) < 4 && down.b) select(down.b.plugin.i); down = null; });
const pk = document.getElementById('pk'), pn = document.getElementById('pn'), pl = document.getElementById('pl');
function select(i){ const p = PROJECTS[i], s = STONES[i % STONES.length]; pk.textContent = `${s[0]} · ${p.kind}`; pn.textContent = p.name; pl.textContent = p.line + '.'; }
addEventListener('resize', build);

function path(b){ g.beginPath(); b.vertices.forEach((v, k) => k ? g.lineTo(v.x, v.y) : g.moveTo(v.x, v.y)); g.closePath(); }
function draw(){
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  // soft contact shadows first, so they never sit on top of a neighbour
  stones.forEach(b => { if (!b.parent || b.position.y < -200) return; g.save(); g.shadowColor = 'rgba(60,50,35,.28)'; g.shadowBlur = 22 * sc; g.shadowOffsetY = 12 * sc; g.fillStyle = 'rgba(0,0,0,.01)'; path(b); g.fill(); g.restore(); });
  stones.forEach(b => {
    if (b.position.y < -200) return;
    const { stone: [, base, hi, txt], w, h, i } = b.plugin, p = PROJECTS[i];
    path(b);
    const gr = g.createLinearGradient(b.position.x - w * .4, b.position.y - h * .7, b.position.x + w * .3, b.position.y + h * .6);
    gr.addColorStop(0, hi); gr.addColorStop(.55, base); gr.addColorStop(1, base);
    g.fillStyle = gr; g.fill();
    // polished highlight and a darker rim
    g.save(); path(b); g.clip();
    const sp = g.createRadialGradient(b.position.x - w * .22, b.position.y - h * .3, 0, b.position.x - w * .22, b.position.y - h * .3, w * .45);
    sp.addColorStop(0, 'rgba(255,255,255,.38)'); sp.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = sp; g.fillRect(b.position.x - w, b.position.y - h, w * 2, h * 2);
    g.lineWidth = 6 * sc; g.strokeStyle = 'rgba(0,0,0,.12)'; path(b); g.stroke();
    g.restore();
    // engraved name
    g.save(); g.translate(b.position.x, b.position.y); g.rotate(b.angle);
    const fs = Math.min(h * .3, w / Math.max(6, p.name.length) * 1.5);
    g.font = `600 ${fs}px 'Bricolage Grotesque'`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillText(p.name, 0, 1);
    g.fillStyle = txt; g.globalAlpha = p.tier === 3 ? .6 : .92; g.fillText(p.name, 0, 0);
    g.restore();
  });
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
(function frame(now){ const dt = Math.min(1000 / 30, now - last); last = now; Engine.update(engine, reduce ? 1000 / 60 : dt); draw(); window.__frames = (window.__frames || 0) + 1; requestAnimationFrame(frame); })(last);
document.fonts.ready.then(draw);
</script>
</body>
</html>
