<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Specimen · Families</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One glass case in a sunlit stone hall; the family's rooms rise into it one at a time, like a museum lift. */
:root{
  --fg:#2a2118; --dim:rgba(42,33,24,.62); --hair:rgba(42,33,24,.2); --brass:#8a6a32;
  --display:'Bodoni Moda',ui-serif,Didot,Georgia,serif; --italic:'Cormorant Garamond',ui-serif,Georgia,serif; --sans:'Manrope',ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#e9dfd0;color:var(--fg);overflow:hidden;font-family:var(--sans)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scrim{position:fixed;inset:0;pointer-events:none;z-index:1;background:linear-gradient(90deg,rgba(233,223,208,.82) 0,rgba(233,223,208,0) 38%),linear-gradient(0deg,rgba(233,223,208,.7) 0,transparent 22%)}
header{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:baseline;padding:calc(24px + env(safe-area-inset-top,0px)) clamp(16px,3vw,44px) 0;z-index:3;font-size:12.5px;letter-spacing:.04em}
.mk{font-family:var(--display);font-size:22px}
.mk i{font-family:var(--italic);font-weight:300}
nav{display:flex;gap:26px;color:var(--dim)}
nav b{color:var(--fg);font-weight:500}
.fams{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:0;right:0;z-index:3;display:flex;justify-content:center;gap:22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(239,232,220,.32);overflow-x:auto;padding:0 16px;scrollbar-width:none}
.fams span{white-space:nowrap;padding-bottom:6px}
.fams{color:rgba(42,33,24,.35)}
.fams b{color:var(--fg);font-weight:500;border-bottom:1px solid var(--brass)}
.cap{position:fixed;left:clamp(16px,3vw,44px);top:50%;transform:translateY(-40%);z-index:2;width:min(440px,calc(100vw - 32px))}
.cap .k{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass)}
.cap h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,4.4vw,66px);line-height:1;margin:10px 0 6px}
.cap .sc{font-family:var(--italic);font-style:italic;font-size:19px;color:var(--dim)}
.cap p{font-size:13.5px;line-height:1.55;margin:14px 0 0;max-width:38ch}
.cap a{display:inline-block;margin-top:16px;color:var(--fg);text-decoration:none;font-size:12px;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid var(--brass);padding-bottom:3px}
.fade{transition:opacity .45s,transform .55s}
.fade.out{opacity:0}
.pills{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px)}
.pills button{border:1px solid var(--hair);background:rgba(255,250,240,.55);color:var(--fg);border-radius:22px;padding:10px 16px;font:12px var(--sans);letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(6px)}
.pills button.on{background:var(--fg);color:#f3ebdd;border-color:var(--fg)}
.pills button:focus-visible{outline:1px solid var(--brass);outline-offset:3px}
.hint{position:fixed;right:clamp(16px,3vw,44px);bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:3;font-family:var(--italic);font-style:italic;font-size:16px;color:var(--dim)}
.arrows{position:fixed;right:clamp(16px,3vw,44px);bottom:calc(38px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:10px;align-items:center}
.arrows button{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);background:rgba(255,250,240,.5);color:var(--fg);font:16px var(--sans);cursor:pointer}
.arrows .z{width:auto;border-radius:22px;padding:0 18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-right:10px}
.arrows button:focus-visible{outline:1px solid var(--brass);outline-offset:3px}
.dots{display:flex;gap:7px;margin-right:8px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--hair)}
.dots i.on{background:var(--fg)}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5;font-family:var(--italic);font-style:italic;font-size:22px;color:#5a4a38;background:#e9dfd0;transition:opacity .8s}
.loading.done{opacity:0;pointer-events:none}
.mockbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));font:10px/1.2 ui-monospace,Menlo,monospace;color:#a7a39b;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08);padding:6px 9px;border-radius:3px;text-decoration:none;z-index:10;white-space:nowrap}
.mockbar b{color:#efeae2;font-weight:500}
@media (max-width:760px){ nav{display:none} .hint{display:none} .fams{justify-content:flex-start;top:calc(64px + env(safe-area-inset-top,0px))} .cap{top:auto;transform:none;bottom:calc(96px + env(safe-area-inset-bottom,0px))} .pills{flex-wrap:nowrap;gap:6px;bottom:calc(36px + env(safe-area-inset-bottom,0px))} .pills button{padding:9px 12px;font-size:11.5px} .scrim{background:linear-gradient(0deg,rgba(233,223,208,.92) 0,rgba(233,223,208,.6) 34%,transparent 52%)} .cap p{display:none} .cap h1{font-size:38px}
  .arrows{left:16px;right:16px;justify-content:space-between;bottom:calc(30px + env(safe-area-inset-bottom,0px))} .mockbar{top:auto;bottom:calc(4px + env(safe-area-inset-bottom,0px))} }
@media (prefers-reduced-motion:reduce){ .fade{transition:none} }
</style>
</head>
<body>
<div class="loading" id="loading">Opening the hall…</div>
<canvas id="gl" aria-label="A single glass case in a sunlit stone hall; each project's small living room rises into it in turn"></canvas>
<div class="scrim"></div>
<header><span class="mk">Kiarash<i>Fa</i></span><nav><span>Home</span><span>Chronology</span><b>Families</b><span>About</span></nav></header>
<div class="fams" id="fams"></div>
<section class="cap fade" id="cap">
  <div class="k" id="k"></div>
  <h1 id="nm"></h1>
  <div class="sc" id="sc"></div>
  <p id="ln"></p>
  <a href="#">Open the project →</a>
</section>
<div class="pills" id="pills"></div><div class="hint">Drag to walk around the case</div>
<a class="mockbar" href="../">← concepts · <b>R03 · Families · The Specimen</b> · three.js · Travertine ambient + rigged figures</a>

<script type="module">
import * as T from '../vendor/three.r03.min.js';
import { FAMILIES, byFamily } from './_data.js';
import { vitrine, rescaleLights } from './_vitrine.js';
import { ROOMS, SCENE_NOTES } from './_rooms.js';
import { buildAmbient } from './_ambients.js';

const Q = new URLSearchParams(location.search), STILL = Q.has('still'), $ = id => document.getElementById(id);
const FAM = 'tributes', LIST = byFamily(FAM).filter(p => ROOMS[p.slug]);
$('fams').innerHTML = FAMILIES.map(f => f.id === FAM ? `<b>${f.name}</b>` : `<span title="Rooms for this family come in a later round">${f.name}</span>`).join('');

const renderer = new T.WebGLRenderer({ canvas: gl, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFShadowMap; T.RectAreaLightUniformsLib.init();
const scene = new T.Scene(), camera = new T.PerspectiveCamera(32, 1, .05, 80);
const amb = await buildAmbient('travertine', { scene, renderer }); amb.plinth.visible = false; renderer.toneMappingExposure = amb.exposure * .95;

// the case, a little grander here: a taller plinth, the hall's sun across it
const v = vitrine({ label: FAMILIES.find(f => f.id === FAM).name, base: .95 }); v.group.position.set(0, 0, -.4); scene.add(v.group);
v.group.traverse(o => { if (o.isMesh && o.material && o.material.color && o.material.clearcoat === 1 && o.material.color.getHex() === 0x0b0b0c) { o.material = o.material.clone(); o.material.color.setHex(0x2a2520); } });
const built = new Map(); let shown = null, cur = Math.max(0, Math.min(LIST.length - 1, parseInt(Q.get('i')) || 0)), want = cur, lift = 0, liftDir = 0;
async function roomFor(p){ if (built.has(p.slug)) return built.get(p.slug); const r = await ROOMS[p.slug](), sc = v.inner.w * .985 / r.size[0]; r.group.scale.setScalar(sc); rescaleLights(r.group, sc); r.depth = r.size[1] * sc; built.set(p.slug, r); return r; }
shown = await roomFor(LIST[cur]); v.stage.add(shown.group);

const composer = new T.EffectComposer(renderer); composer.addPass(new T.RenderPass(scene, camera));
const gtao = new T.GTAOPass(scene, camera, 1, 1); gtao.updateGtaoMaterial({ radius: .06, distanceExponent: 1.4, thickness: .04, scale: 1.1, samples: 16 }); composer.addPass(gtao);
const bokeh = new T.BokehPass(scene, camera, { focus: 3, aperture: .004, maxblur: .005 }); composer.addPass(bokeh);
composer.addPass(new T.UnrealBloomPass(new T.Vector2(1, 1), amb.bloom[0], amb.bloom[1], 1.05)); composer.addPass(new T.OutputPass());
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.fov = w < h ? 46 : 32; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// the family as pills; switching sends the room down into the plinth and lifts the next one up
$('pills').innerHTML = LIST.map((p, i) => `<button data-i="${i}">${p.name}</button>`).join('');
$('pills').onclick = e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); };
function caption(){ const p = LIST[cur]; $('cap').classList.add('out'); setTimeout(() => { $('k').textContent = FAMILIES.find(f => f.id === FAM).name + (p.flagship ? ' · a flagship' : ''); $('nm').textContent = p.name;
  $('sc').textContent = SCENE_NOTES[p.slug] || ''; $('ln').textContent = p.line; $('cap').classList.remove('out'); }, STILL ? 0 : 300);
  [...$('pills').children].forEach((b, k) => b.classList.toggle('on', k === cur)); }
function go(i){ if (i === want) return; want = i; if (liftDir === 0) liftDir = -1; }
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go((want + 1) % LIST.length); if (e.key === 'ArrowLeft') go((want - 1 + LIST.length) % LIST.length); });
caption();

// orbit by drag, idle drift
let th = +(Q.get('th') || .55), thV = 0, drag = null, idle = 0;
gl.addEventListener('pointerdown', e => { drag = e.clientX; idle = 0; gl.setPointerCapture(e.pointerId); });
gl.addEventListener('pointermove', e => { if (drag === null) return; thV = (e.clientX - drag) * -.006; th += thV; drag = e.clientX; });
gl.addEventListener('pointerup', () => drag = null);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), t = 3;
async function frame(now){
  const dt = STILL ? 0 : Math.min(.05, (now - last) / 1000); last = now; t += dt; idle += dt;
  if (drag === null) { thV *= .92; th += thV + (idle > 4 && !reduce ? dt * .05 : 0); }
  if (liftDir) { lift += liftDir * dt / .9; if (lift <= -1) { lift = -1; shown.group.removeFromParent(); cur = want; caption(); shown = await roomFor(LIST[cur]); v.stage.add(shown.group); liftDir = 1; }
    if (lift >= 0 && liftDir === 1) { lift = 0; liftDir = 0; if (want !== cur) liftDir = -1; } }
  if (shown) { shown.group.position.y = (lift < 0 ? -(1 - Math.cos(-lift * Math.PI / 2)) : 0) * .75; shown.update(t, dt || 1e-4); }
  amb.update(t);
  const portrait = innerWidth < innerHeight, R = portrait ? 4.6 : 3.55, cx = Math.sin(th) * R, cz = Math.cos(th) * R - .4;
  camera.position.set(cx, portrait ? 2.75 : 2.3, cz); const look = new T.Vector3(portrait ? 0 : -Math.cos(th) * .45, portrait ? .95 : 1.08, -.4 + (portrait ? 0 : Math.sin(th) * .45)); camera.lookAt(look);
  bokeh.uniforms.focus.value = camera.position.distanceTo(new T.Vector3(0, 1.1, -.4));
  composer.render(); window.__frames = (window.__frames || 0) + 1; requestAnimationFrame(frame);
}
shown.update(t, .5);
requestAnimationFrame(n => { $('loading').classList.add('done'); last = n; frame(n); });
</script>
</body>
</html>
