<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trophy Shelf · Round 02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one long lit wall. Words float in the dark above and below it like gallery vinyl. */
:root{
  --room:#09090A; --fg:#ECE8E0; --dim:rgba(236,232,224,.5); --brass:#CFA968; --hair:rgba(236,232,224,.14);
  --display:'Marcellus',ui-serif,Georgia,serif; --sans:'Jost',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--room);color:var(--fg);overflow:hidden;font-family:var(--sans)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:baseline;padding:calc(22px + env(safe-area-inset-top,0px)) clamp(16px,3vw,44px) 0;z-index:2;font-size:12px;letter-spacing:.08em}
.mk{font-family:var(--display);font-size:22px;letter-spacing:.12em}
nav{display:flex;gap:26px;color:var(--dim);text-transform:uppercase;font-size:11px;letter-spacing:.18em}
.lede{position:fixed;left:clamp(16px,3vw,44px);top:calc(clamp(70px,11vh,110px) + env(safe-area-inset-top,0px));z-index:2;max-width:min(560px,calc(100vw - 32px))}
.lede h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,3vw,46px);line-height:1.1;margin:0;letter-spacing:.01em}
.lede h1 em{font-style:normal;color:var(--brass)}
.focus{position:fixed;left:clamp(16px,3vw,44px);right:clamp(16px,3vw,44px);bottom:clamp(20px,4vh,40px);z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-top:1px solid var(--hair);padding-top:12px}
.focus .n{font-family:var(--display);font-size:clamp(26px,2.4vw,36px)}
.focus .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:4px}
.focus .l{font-size:14px;line-height:1.5;color:var(--dim);max-width:46ch;text-align:right;font-weight:300}
.mockbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));font:10px/1.2 ui-monospace,Menlo,monospace;color:#9a968f;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.08);padding:6px 9px;border-radius:3px;text-decoration:none;z-index:10;white-space:nowrap}
.mockbar b{color:#ece8e0;font-weight:500}
@media (max-width:760px){ nav{display:none} .lede h1{font-size:22px} .focus{flex-direction:column;align-items:flex-start;bottom:30px} .focus .l{text-align:left} .mockbar{top:auto;bottom:calc(4px + env(safe-area-inset-bottom,0px))} }
</style>
</head>
<body>
<canvas id="gl" aria-label="A lit trophy wall; each niche holds one project's object"></canvas>
<header><span class="mk">KIARASHFA</span><nav><span>Index</span><span>Families</span><span>About</span><span>Sound ○</span></nav></header>
<section class="lede"><h1>No one handed these out. <em>I made them because I wished they existed.</em></h1></section>
<section class="focus"><div><div class="k" id="fk"></div><div class="n" id="fn"></div></div><div class="l" id="fl"></div></section>
<a class="mockbar" href="../">← concepts · <b>R02 · 07 Trophy Shelf</b> · three.js · niches + reflective floor</a>

<script type="module">
import * as T from '../vendor/three.bundle.min.js';
import { PROJECTS, FAMILIES } from './_data.js';
import { makeSculpture } from './_sculptures.js';
await Promise.race([Promise.all([document.fonts.load('44px Marcellus'), document.fonts.load('22px Jost')]), new Promise(r => setTimeout(r, 2500))]);

const renderer = new T.WebGLRenderer({ canvas: gl, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new T.Scene(); scene.background = new T.Color(0x09090a); scene.fog = new T.Fog(0x09090a, 10, 30);
scene.environment = new T.PMREMGenerator(renderer).fromScene(new T.RoomEnvironment(), .04).texture; scene.environmentIntensity = .35;
const camera = new T.PerspectiveCamera(32, 1, .05, 80);
scene.add(new T.HemisphereLight(0x2a2620, 0x050505, .6));

const lacquer = new T.MeshPhysicalMaterial({ color: 0x0b0b0c, roughness: .22, clearcoat: 1, clearcoatRoughness: .06 });
const brass = new T.MeshPhysicalMaterial({ color: 0xcfa968, metalness: 1, roughness: .28 });
const backTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#d9c7a4'); gr.addColorStop(.25, '#6e604c'); gr.addColorStop(1, '#161412'); g.fillStyle = gr; g.fillRect(0, 0, 64, 256); const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t; })();
const plaque = (p, fam) => { const c = document.createElement('canvas'); c.width = 512; c.height = 128; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 128); gr.addColorStop(0, '#e7c98d'); gr.addColorStop(.5, '#b88d4a'); gr.addColorStop(1, '#8a6532'); g.fillStyle = gr; g.fillRect(0, 0, 512, 128);
  g.textAlign = 'center'; g.fillStyle = 'rgba(255,240,210,.55)'; g.font = "44px Marcellus, Georgia, serif"; g.fillText(p.name.toUpperCase(), 257, 66);
  g.fillStyle = '#3a2a14'; g.fillText(p.name.toUpperCase(), 256, 64); g.font = "22px Jost, sans-serif"; if (fam) g.fillText(fam.toUpperCase(), 256, 104);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 8; return t; };

// Lay the wall out family by family, three niches high; the wall simply gets longer.
const ROWS = innerWidth < innerHeight ? 4 : 3, CW = 1.25, CH = 1.25, DEPTH = .7, GAP = .1, SECTION_GAP = .55;
const niches = []; let x = 0;
const wall = new T.Group(); scene.add(wall);
FAMILIES.forEach(f => {
  const items = PROJECTS.filter(p => p.family === f.id); if (!items.length) return;
  const cols = Math.ceil(items.length / ROWS), x0 = x, secW = cols * (CW + GAP) + GAP;
  // family name engraved in a brass strip over its section
  const label = (() => { const c = document.createElement('canvas'); c.width = 1024; c.height = 64; const g = c.getContext('2d'); g.fillStyle = '#0b0b0c'; g.fillRect(0, 0, 1024, 64);
    g.fillStyle = '#cfa968'; g.font = "34px Marcellus, Georgia, serif"; g.textAlign = 'center'; g.fillText(f.name.toUpperCase().split('').join(' '), 512, 44); const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t; })();
  const lab = new T.Mesh(new T.PlaneGeometry(Math.max(secW, 1.6), .1), new T.MeshBasicMaterial({ map: label })); lab.position.set(x0 + secW / 2, ROWS * (CH + GAP) + GAP + .12, DEPTH / 2 + .01); wall.add(lab);
  items.forEach((p, k) => {
    const col = Math.floor(k / ROWS), row = ROWS - 1 - (k % ROWS), cx = x0 + GAP + col * (CW + GAP) + CW / 2, cy = GAP + row * (CH + GAP) + CH / 2;
    const back = new T.Mesh(new T.PlaneGeometry(CW, CH), new T.MeshStandardMaterial({ map: backTex, emissive: 0xffffff, emissiveMap: backTex, emissiveIntensity: .35, roughness: .9 }));
    back.position.set(cx, cy, -DEPTH / 2 + .01); wall.add(back);
    const strip = new T.Mesh(new T.BoxGeometry(CW * .92, .012, .02), new T.MeshBasicMaterial({ color: 0xfff1d6 })); strip.position.set(cx, cy + CH / 2 - .02, DEPTH / 2 - .08); wall.add(strip);
    const L = new T.PointLight(0xffe2b8, 2.2, 2.4, 1.5); L.position.set(cx, cy + CH / 2 - .1, DEPTH / 2 - .1); wall.add(L);
    const ped = new T.Mesh(new T.BoxGeometry(CW * .5, .12, DEPTH * .5), lacquer); ped.position.set(cx, cy - CH / 2 + .06, -.02); wall.add(ped);
    const plq = new T.Mesh(new T.PlaneGeometry(CW * .46, CW * .115), new T.MeshStandardMaterial({ map: plaque(p, f.name), metalness: .6, roughness: .35 })); plq.position.set(cx, cy - CH / 2 + .06, DEPTH * .25 - .019); wall.add(plq);
    const o = makeSculpture(p); const b = new T.Box3().setFromObject(o), sz = b.getSize(new T.Vector3());
    const sc = (p.flagship ? .86 : .74) / Math.max(sz.y, sz.x * .75, sz.z * .75); o.scale.setScalar(sc); o.position.set(cx, cy - CH / 2 + .12, -.02); wall.add(o);
    niches.push({ p, f, o, L, back, cx, cy, spin: k });
  });
  // empty niches wait with a blank brass plate: room to grow
  for (let k = items.length; k < cols * ROWS; k++) { const col = Math.floor(k / ROWS), row = ROWS - 1 - (k % ROWS), cx = x0 + GAP + col * (CW + GAP) + CW / 2, cy = GAP + row * (CH + GAP) + CH / 2;
    const plq = new T.Mesh(new T.PlaneGeometry(CW * .3, CW * .07), new T.MeshStandardMaterial({ map: plaque({ name: 'Reserved' }, ''), metalness: .6, roughness: .35 })); plq.position.set(cx, cy - CH / 2 + .1, -DEPTH / 2 + .02); wall.add(plq); }
  // the lacquer carcass of this section, with brass edges
  const totalH = ROWS * (CH + GAP) + GAP;
  const frameMat = lacquer; const add = (w, h, d, px, py, pz, m = frameMat) => { const b = new T.Mesh(new T.BoxGeometry(w, h, d), m); b.position.set(px, py, pz); wall.add(b); };
  for (let r = 0; r <= ROWS; r++) { add(secW, GAP, DEPTH, x0 + secW / 2, r * (CH + GAP) + GAP / 2, 0); add(secW, .008, .008, x0 + secW / 2, r * (CH + GAP) + GAP, DEPTH / 2, brass); }
  for (let c = 0; c <= cols; c++) { add(GAP, totalH, DEPTH, x0 + c * (CW + GAP) + GAP / 2, totalH / 2, 0); add(.008, totalH, .008, x0 + c * (CW + GAP) + GAP, totalH / 2, DEPTH / 2, brass); }
  add(secW, totalH, .04, x0 + secW / 2, totalH / 2, -DEPTH / 2);
  x += secW + SECTION_GAP;
});
const wallW = x - SECTION_GAP, wallH = ROWS * (CH + GAP) + GAP; wall.position.set(-wallW / 2, .02, 0);
// polished stone floor that mirrors the wall
const mirror = new T.Reflector(new T.PlaneGeometry(80, 30), { color: 0x2a2a2c, textureWidth: innerWidth * .6, textureHeight: innerHeight * .6, clipBias: .003 });
mirror.rotation.x = -Math.PI / 2; mirror.position.y = 0; scene.add(mirror);
const stone = new T.Mesh(new T.PlaneGeometry(80, 30), new T.MeshStandardMaterial({ color: 0x0c0c0d, transparent: true, opacity: .82, roughness: .35 })); stone.rotation.x = -Math.PI / 2; stone.position.y = .004; scene.add(stone);

let target = 0, pos = 0, focus = 0;
addEventListener('wheel', e => { target += (e.deltaY + e.deltaX) * .004; }, { passive: true });
let tx = null; addEventListener('pointerdown', e => tx = e.clientX); addEventListener('pointerup', () => tx = null);
const ray = new T.Raycaster(), mouse = new T.Vector2(9, 9); let mx = 0, my = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; mouse.set(mx * 2, -my * 2); if (tx !== null && e.pointerType !== 'mouse') { target -= (e.clientX - tx) * .01; tx = e.clientX; } });
const startNiche = location.hash ? +(location.hash.slice(1)) : -1;
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 44 : 32; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const fk = document.getElementById('fk'), fn = document.getElementById('fn'), fl = document.getElementById('fl');
function show(n){ fk.textContent = n.f.name + (n.p.flagship ? ' · Flagship' : ''); fn.textContent = n.p.name; fl.textContent = n.p.line + (n.p.for ? ` Made for ${n.p.for}.` : ''); }
if (startNiche >= 0) { focus = startNiche; target = pos = niches[focus].cx - wallW / 2; } else { target = pos = niches[0].cx - wallW / 2 + (innerWidth < innerHeight ? .7 : -2.2); }
show(niches[focus]);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const meshes = []; niches.forEach((n, i) => n.o.traverse(m => { if (m.isMesh) { m.userData.n = i; meshes.push(m); } }));
function frame(now){
  const t = now / 1000, portrait = innerWidth < innerHeight;
  target = Math.max(-wallW / 2 - 2.6, Math.min(wallW / 2 - 1, target)); pos += (target - pos) * .06;
  camera.position.set(pos + mx * .6, wallH * (portrait ? .6 : .6) - my * .3, portrait ? 11.5 : 11.2); camera.lookAt(pos, wallH * (portrait ? .56 : .58), 0);
  ray.setFromCamera(mouse, camera); const h = ray.intersectObjects(meshes, false)[0];
  if (h && h.object.userData.n !== focus) { focus = h.object.userData.n; show(niches[focus]); }
  niches.forEach((n, i) => { const on = i === focus; n.spin += (on ? .9 : .12) * .016; if (!reduce) n.o.rotation.y = Math.sin(n.spin) * (on ? 3.14 : .5); n.o.userData.tick(t);
    n.L.intensity += ((on ? 5 : 2) - n.L.intensity) * .08; n.back.material.emissiveIntensity += ((on ? .7 : .3) - n.back.material.emissiveIntensity) * .08; });
  renderer.render(scene, camera); window.__frames = (window.__frames || 0) + 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
