<script>

// ---------- inks, paper, seeded randomness ----------
const INKS = [ // spot inks: colour, screen angle, misregistration (px)
  { rgb: [61, 85, 136], ang: 15, off: [.9, -.6] },   // federal blue: linework and darks
  { rgb: [241, 80, 96], ang: 75, off: [-1.0, .5] },  // bright red
  { rgb: [255, 226, 0], ang: 0, off: [.5, 1.1] },    // yellow
  { rgb: [0, 131, 138], ang: 45, off: [-.6, -1.0] }, // teal

const PAPER = [243, 235, 216];
function hash3(a, b, c){ let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177); h = Math.imul(h ^ (h >>> 13), 1103515245); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

// ---------- the painter: four coverage plates, knock-outs, boiling linework ----------
const CELL = 560, ROOM = 7.2, WH = 4.6, S = 36;
const T = (b = 0, r = 0, y = 0, t = 0) => [b, r, y, t];
class Painter {
  constructor(N, q, seed){ this.N = N; this.q = q; this.seed = seed; const r = rng(seed * 7919 + 13); this.ph = [r() * 9, r() * 9, r() * 9, r() * 9];

    this.L.forEach((g, k) => { if (knock) { g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.fill(p); }
      if (k < 4 && tone[k] > 0) { g.globalCompositeOperation = 'source-over'; g.fillStyle = `rgba(0,0,0,${Math.min(1, tone[k])})`; g.fill(p); } }); }

  stroke(pts, w = 1.5, k = 0){ if (pts.length < 2) return; const n = pts.length, L = [], R = [];
    for (let i = 0; i < n; i++) { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)]; let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const t = i / (n - 1), wi = w * (.28 + .72 * Math.pow(Math.sin(Math.PI * t), .6)); L.push([pts[i][0] - dy * wi * .5, pts[i][1] + dx * wi * .5]); R.push([pts[i][0] + dy * wi * .5, pts[i][1] - dx * wi * .5]); }
    const g = this.L[k === 0 ? 4 : k]; g.globalCompositeOperation = 'source-over'; g.fillStyle = '#000'; g.fill(this.path(L.concat(R.reverse()))); }
  outline(pts, closed = true, w){ const ring = closed ? pts.concat([pts[0]]) : pts; const dens = [];
    for (let i = 0; i < ring.length - 1; i++) { const a = ring[i], b = ring[i + 1], steps = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 6)); for (let s = 0; s < steps; s++) dens.push([a[0] + (b[0] - a[0]) * s / steps, a[1] + (b[1] - a[1]) * s / steps]); }
    dens.push(ring[ring.length - 1]); const chunk = 14; for (let i = 0; i < dens.length - 1; i += chunk - 2) this.stroke(dens.slice(i, i + chunk).map(p => this.wob(p)), w); }
  shape(pts, tone, o = {}){ const d = densify(pts, 7).map(p => this.wob(p)); this.fill(d, tone, o.knock !== false); if (o.line !== false) this.outline(pts, true, o.w); }
}
function densify(pts, step){ const out = []; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length], n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step)); for (let s = 0; s < n; s++) out.push([a[0] + (b[0] - a[0]) * s / n, a[1] + (b[1] - a[1]) * s / n]); } return out; }

// ---------- halftone and overprint: every colour is a dot screen of one spot ink ----------

    for (let k = 0; k < 4; k++) {
      const I = ink[k], A = cov[k], px = x - I.ox, py = y - I.oy, ix = px | 0, iy = py | 0;
      if (ix < 0 || iy < 0 || ix >= N || iy >= N) continue;
      const pc = A[(iy * N + ix) * 4 + 3] / 255; if (pc < .03) continue;

      else { const u = px * I.c + py * I.s, v = -px * I.s + py * I.c, cu = Math.floor(u / sp), cv = Math.floor(v / sp), uc = (cu + .5) * sp, vc = (cv + .5) * sp;
        const xc = (uc * I.c - vc * I.s) | 0, yc = (uc * I.s + vc * I.c) | 0, cc = (xc >= 0 && yc >= 0 && xc < N && yc < N) ? A[(yc * N + xc) * 4 + 3] / 255 : pc;
        const h = hash3(cu, cv, k), r = sp * .71 * Math.sqrt(cc) * (.9 + .2 * h), du = u - uc - (h - .5) * .7 * q, dv = v - vc - (hash3(cv, cu, k + 9) - .5) * .7 * q;
        a = Math.max(0, Math.min(1, r - Math.sqrt(du * du + dv * dv) + .5)) * .95; }

}

// ---------- isometric dollhouse ----------
const CX = CELL / 2, CY = 230, C30 = Math.cos(Math.PI / 6);
const I = (x, y, z = 0) => [CX + (x - y) * C30 * S, CY + (x + y) * .5 * S - z * S];
const add = (a, b) => a.map((v, i) => Math.min(1, v + b[i]));
const darker = (t, f) => [Math.min(1, t[0] + f), t[1] * (1 + f * .3), t[2] * (1 + f * .2), t[3] * (1 + f * .3)];
function room(P, o){ const W = ROOM, H = WH, th = .35;
  P.shape([I(0, 0, 0), I(0, W, 0), I(0, W, H), I(0, 0, H)], o.wallL);
  P.shape([I(0, 0, 0), I(W, 0, 0), I(W, 0, H), I(0, 0, H)], o.wallR);
  P.shape([I(0, 0, H), I(0, W, H), I(-th, W, H), I(-th, -th, H), I(W, -th, H), I(W, 0, H)], T(.1, .05, .1));
  P.shape([I(0, 0, 0), I(W, 0, 0), I(W, W, 0), I(0, W, 0)], o.floor);
  P.shape([I(0, W, 0), I(W, W, 0), I(W, W, -th), I(0, W, -th)], darker(o.floor, .35));
  P.shape([I(W, 0, 0), I(W, W, 0), I(W, W, -th), I(W, 0, -th)], darker(o.floor, .55));
  if (o.planks) for (let k = 1; k < 9; k++) P.outline([I(0, k * W / 9, 0), I(W, k * W / 9, 0)], false, .7);
  if (o.tiles) for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) if ((i + j) % 2) P.shape([I(i * W / 6, j * W / 6), I((i + 1) * W / 6, j * W / 6), I((i + 1) * W / 6, (j + 1) * W / 6), I(i * W / 6, (j + 1) * W / 6)], o.tiles, { line: false });
  P.outline([I(0, W, .25), I(0, 0, .25), I(W, 0, .25)], false, .8);
}
function cub(P, x, y, z, w, d, h, t, o = {}){
  P.shape([I(x, y + d, z), I(x + w, y + d, z), I(x + w, y + d, z + h), I(x, y + d, z + h)], darker(t, .18), o);
  P.shape([I(x + w, y, z), I(x + w, y + d, z), I(x + w, y + d, z + h), I(x + w, y, z + h)], darker(t, .38), o);
  P.shape([I(x, y, z + h), I(x + w, y, z + h), I(x + w, y + d, z + h), I(x, y + d, z + h)], t, o); }
const ell = (cx, cy, rx, ry, n = 28, a0 = 0, a1 = Math.PI * 2) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });
function cyl(P, x, y, z, r, h, t){ const [bx, by] = I(x, y, z), [tx, ty] = I(x, y, z + h), rx = r * 1.2247 * S, ry = r * .7071 * S;
  P.shape(ell(bx, by, rx, ry, 20, 0, Math.PI).concat(ell(tx, ty, rx, ry, 20, Math.PI, 0)), darker(t, .25)); P.shape(ell(tx, ty, rx, ry, 28), t); }
const wallR = (P, x0, x1, z0, z1, t, o) => P.shape([I(x0, .02, z0), I(x1, .02, z0), I(x1, .02, z1), I(x0, .02, z1)], t, o);
const wallL = (P, y0, y1, z0, z1, t, o) => P.shape([I(.02, y0, z0), I(.02, y1, z0), I(.02, y1, z1), I(.02, y0, z1)], t, o);
// light is ink: stepped halftone rings, never a smooth gradient
function pool(P, x, y, r, z = 0){ const [cx, cy] = I(x, y, z); [1, .75, .5, .28].forEach((f, i) => P.overlay(ell(cx, cy, r * f * 1.2247 * S, r * f * .7071 * S, 36), T(0, .04 * i, .14 + i * .07))); }
function glowR(P, x, z, r){ const [cx, cy] = I(x, .03, z); [1, .7, .45].forEach((f, i) => P.overlay(ell(cx, cy, r * f * S * .9, r * f * S * .9, 30), T(0, 0, .14 + i * .1))); }
function books(P, x, y, z, w, d, h, seed){ const r = rng(seed); let bx = x; const cols = [T(.1, .7, .2), T(.6, .1, 0, .2), T(0, .2, .8), T(.15, 0, .3, .6), T(.5, .45, .1)];

function pendant(P, x, y, z){ const [a, b] = I(x, y, WH), [c, d] = I(x, y, z + .4); P.stroke([[a, b], [c, d]], .9); const [sx, sy] = I(x, y, z);
  P.shape([[sx - 14, sy + 2], [sx - 5, sy - 12], [sx + 5, sy - 12], [sx + 14, sy + 2]], T(.15, .1, 0, .7)); pool(P, x, y, 1.5); }
function plant(P, x, y){ cyl(P, x, y, 0, .28, .5, T(.05, .5, .55)); const [cx, cy] = I(x, y, .5);
  for (let k = 0; k < 7; k++) { const a = -Math.PI / 2 + (k - 3) * .38, L = 22 + (k % 3) * 6; P.shape(ell(cx + Math.cos(a) * L * .5, cy + Math.sin(a) * L * .5, 5, L * .5, 12).map(([px, py]) => { const dx = px - cx - Math.cos(a) * L * .5, dy = py - cy - Math.sin(a) * L * .5, ca = Math.cos(a + Math.PI / 2), sa = Math.sin(a + Math.PI / 2); return [cx + Math.cos(a) * L * .5 + dx * ca - dy * sa, cy + Math.sin(a) * L * .5 + dx * sa + dy * ca]; }), T(.15, 0, .35, .7), { w: .7 }); } }

// ---------- people: one skeleton, tapering volumes, clothing, faces ----------
function capsule(a, b, ra, rb, n = 7){ const dx = b[0] - a[0], dy = b[1] - a[1], ang = Math.atan2(dy, dx), pts = [];

const POSES = { // angles from straight down; positive swings forward. Three keys per clip (drawn on twos).
  stand: [{ lean: .02, sh: [.05, -.08], el: [.15, .2], hip: [.02, -.02], kn: [0, 0] }],
  work: [{ lean: .14, sh: [.7, .9], el: [.6, .5], hip: [.05, -.04], kn: [0, 0] }, { lean: .15, sh: [.78, .95], el: [.45, .6], hip: [.05, -.04], kn: [0, 0] }, { lean: .13, sh: [.66, .85], el: [.7, .45], hip: [.05, -.04], kn: [0, 0] }],
  stir: [{ lean: .1, sh: [.3, 1.0], el: [.4, .7], hip: [.04, -.03], kn: [0, 0] }, { lean: .1, sh: [.3, .85], el: [.4, .95], hip: [.04, -.03], kn: [0, 0] }, { lean: .1, sh: [.3, 1.1], el: [.4, .55], hip: [.04, -.03], kn: [0, 0] }],
  shake: [{ lean: -.02, sh: [.4, 2.3], el: [.9, .5], hip: [.02, -.02], kn: [0, 0] }, { lean: -.02, sh: [.4, 2.6], el: [.9, .2], hip: [.02, -.02], kn: [0, 0] }, { lean: -.02, sh: [.4, 2.1], el: [.9, .8], hip: [.02, -.02], kn: [0, 0] }],
  point: [{ lean: .04, sh: [.05, 1.9], el: [.2, .1], hip: [.08, -.06], kn: [0, 0] }, { lean: .04, sh: [.05, 2.0], el: [.2, .05], hip: [.08, -.06], kn: [0, 0] }, { lean: .04, sh: [.05, 1.85], el: [.2, .2], hip: [.08, -.06], kn: [0, 0] }],
  look: [{ lean: -.03, sh: [-.25, -.3], el: [.9, .9], hip: [.03, -.03], kn: [0, 0] }],
  sit: [{ lean: .08, sh: [.55, .7], el: [.8, .7], hip: [1.45, 1.4], kn: [-1.45, -1.3], seat: true }, { lean: .1, sh: [.6, .75], el: [.75, .65], hip: [1.45, 1.4], kn: [-1.45, -1.3], seat: true }, { lean: .08, sh: [.55, .72], el: [.85, .7], hip: [1.45, 1.4], kn: [-1.45, -1.3], seat: true }],
  read: [{ lean: .12, sh: [.85, .95], el: [1.2, 1.1], hip: [1.45, 1.4], kn: [-1.45, -1.3], seat: true }],
  think: [{ lean: .1, sh: [.5, .3], el: [.8, 2.2], hip: [1.45, 1.4], kn: [-1.45, -1.3], seat: true }],
  dance: [{ lean: -.04, sh: [2.5, 2.7], el: [.4, .5], hip: [.2, -.25], kn: [-.3, .1] }, { lean: .04, sh: [2.2, 2.9], el: [.6, .3], hip: [-.1, .15], kn: [.05, -.35] }, { lean: -.02, sh: [2.7, 2.4], el: [.3, .6], hip: [.15, -.1], kn: [-.2, -.05] }],

function person(P, x, y, o, v){ // feet (or seat) at iso floor point x,y
  const pose = (POSES[o.pose] || POSES.stand)[v % (POSES[o.pose] || POSES.stand).length], f = o.face || 1, H = (o.h || 1.78) * 1.38 * S;

    cub(P, 4.0, .5, 0, 2.0, 1.4, 1.0, T(0, .05, .1)); cub(P, 4.5, .7, 1.0, 1.0, .9, .9, T(0, .04, .12)); wallR(P, 4.65, 5.35, 1.25, 1.8, T(.3, 0, .05, .6));
    cub(P, 1.6, 2.4, 0, .7, .5, .55, T(.7, .1)); person(P, 1.9, 2.0, { pose: 'sit', face: -1, seatH: .55, shirt: T(.75, .05, .05, .1), pants: T(.75, .1), hair: T(.7, .4) }, v);
    person(P, 5.6, 4.9, { pose: 'stand', face: -1, shirt: T(.55, 0, .05, .2), pants: T(.6, .1), hair: T(.2, .6, .7), beard: true }, v); },
  constyx(P, v){ room(P, { wallL: WALL.night, wallR: T(.9, 0, 0, .55), floor: T(.8, .1, 0, .4), planks: false });
    const r = rng(41 + v); for (let i = 0; i < 18; i++) { const x = .4 + i * .36, z0 = 1.0 + r() * 1.5, L = .6 + r() * 1.4; for (let s = 0; s < 6; s++) { const z = z0 + s * L / 6; if (z > WH - .2) break; wallR(P, x, x + .09, z, z + .12, T(0, 0, .2 + s * .12, .1), { line: false }); } }
    cub(P, 2.6, 3.2, 0, 1.2, 1.2, .7, T(.9, .3)); cub(P, 2.6, 4.1, .7, 1.2, .3, 1.3, T(.9, .3));
    person(P, 3.2, 3.6, { pose: 'sit', face: -1, seatH: .7, shirt: T(.95, .3, 0, .2), pants: T(.95, .2), hair: T(.95, .3) }, v); },
  drxrates(P, v){ room(P, { wallL: WALL.night, wallR: T(.6, .3, 0, .1), floor: T(.4, .7, .2), planks: false });
    wallR(P, .8, 5.8, 1.4, 3.8, T(0, .05, .12)); wallR(P, 1.2, 3.0, 1.8, 3.2, T(0, .5, .8)); wallR(P, 3.0, 5.4, 1.8, 3.4, T(.3, 0, .2, .4));
    const [bx, by] = I(6.6, 6.6, 2.6); P.overlay([[bx, by], I(.8, .05, 3.8), I(5.8, .05, 1.4)], T(0, 0, .14)); P.overlay([[bx, by], I(1.6, .05, 3.4), I(5.0, .05, 1.9)], T(0, 0, .14));
    for (let k = 0; k < 2; k++) { cub(P, 1.2 + k * 2.6, 3.8, 0, 1.8, 1.2, .6, T(.1, .9, .4)); cub(P, 1.2 + k * 2.6, 4.7, .6, 1.8, .3, .9, T(.1, .9, .4)); }
    person(P, 2.2, 4.3, { pose: 'sit', face: -1, seatH: .6, shirt: T(0, .05, .7), pants: T(.6, .2), hair: T(.8, .2) }, v);
    cub(P, 6.0, 5.9, 2.2, .7, .6, .45, T(.7, .2)); },
  website(P, v){ room(P, { wallL: WALL.cream, wallR: WALL.teal, floor: WOOD, planks: true });
    const [mx, my] = I(2.6, .03, 2.7); P.shape(ell(mx, my, 34, 40, 30), T(.2, 0, .15, .5)); P.shape(ell(mx, my, 28, 34, 30), T(0, 0, .04, .08)); P.overlay(ell(mx - 8, my - 10, 8, 12, 12), T(0, 0, 0, 0));
    cub(P, 3.8, .4, 0, 2.4, 1.0, 1.15, WOOD); cub(P, 4.4, .5, 1.15, 1.1, .7, .06, T(.6, .1)); wallR(P, 4.45, 5.45, 1.21, 1.85, T(.2, .1, .3, .4));
    wallL(P, 1.4, 3.0, 2.0, 3.4, T(0, .5, .2)); plant(P, .7, 5.6); pool(P, 4.6, 2.4, 1.6); pendant(P, 4.6, 2.4, 3.0);
    person(P, 2.5, 1.9, { pose: 'stand', face: -1, shirt: T(.05, .6, .7), pants: T(.55, .1), hair: T(.8, .3), beard: true }, v); },
};

// ---------- the sheet: boxes packed like a poster, with printer's marks ----------
const mobile = innerWidth < 760, Q = mobile ? 1 : 1.4, GUT = 26, MAR = 170;
const n = PROJECTS.length, cols = Math.max(2, Math.round(Math.sqrt(n * 1.1))), rows = Math.ceil(n / cols);
const SW = cols * CELL + (cols - 1) * GUT + MAR * 2, SH = rows * CELL + (rows - 1) * GUT + MAR * 2;
const boxes = PROJECTS.map((p, i) => ({ p, x: MAR + (i % cols) * (CELL + GUT), y: MAR + Math.floor(i / cols) * (CELL + GUT), v: [], born: 0 }));
const sheet = document.createElement('canvas'); sheet.width = Math.ceil(SW / 2); sheet.height = Math.ceil(SH / 2);
(() => { const g = sheet.getContext('2d'), img = g.createImageData(sheet.width, sheet.height);
  for (let i = 0; i < img.data.length; i += 4) { const k = .985 + .03 * Math.random(); img.data[i] = PAPER[0] * k; img.data[i + 1] = PAPER[1] * k; img.data[i + 2] = PAPER[2] * k; img.data[i + 3] = 255; } g.putImageData(img, 0, 0);
  g.scale(.5, .5); const blue = 'rgb(61,85,136)', bx0 = MAR - 30, by0 = MAR - 30, bx1 = SW - MAR + 30, by1 = SH - MAR + 30;
  g.strokeStyle = blue; g.lineWidth = 2;
  [[bx0, by0, -1, -1], [bx1, by0, 1, -1], [bx0, by1, -1, 1], [bx1, by1, 1, 1]].forEach(([x, y, sx, sy]) => { g.beginPath(); g.moveTo(x + sx * 20, y); g.lineTo(x + sx * 90, y); g.moveTo(x, y + sy * 20); g.lineTo(x, y + sy * 90); g.stroke(); });
  const target = (x, y) => { g.beginPath(); g.arc(x, y, 22, 0, 7); g.moveTo(x - 36, y); g.lineTo(x + 36, y); g.moveTo(x, y - 36); g.lineTo(x, y + 36); g.stroke(); g.beginPath(); g.arc(x, y, 9, 0, 7); g.fillStyle = blue; g.fill(); };
  target(SW / 2, MAR / 2); target(SW / 2, SH - MAR / 2); target(MAR / 2, SH / 2); target(SW - MAR / 2, SH / 2);
  INKS.forEach((k, i) => [1, .7, .4, .2].forEach((a, j) => { g.fillStyle = `rgba(${k.rgb.join(',')},${a})`; g.fillRect(SW - MAR - 4 * 4 * 46 + (i * 4 + j) * 46, SH - MAR + 70, 40, 40); }));
  g.globalCompositeOperation = 'multiply'; g.fillStyle = 'rgba(241,80,96,.9)'; g.fillRect(MAR, SH - MAR + 70, 120, 40); g.fillStyle = 'rgba(255,226,0,.9)'; g.fillRect(MAR + 60, SH - MAR + 70, 120, 40); g.fillStyle = 'rgba(0,131,138,.8)'; g.fillRect(MAR + 120, SH - MAR + 70, 120, 40);
})();

// bake progressively: the first pass prints the sheet, the two later passes give the line its boil
const order = boxes.map((_, i) => i);
let bakeQueue = [0, 1, 2].flatMap(v => order.map(i => [i, v])), baked = 0;
function bakeNext(){ const job = bakeQueue.shift(); if (!job) return; const [i, v] = job, b = boxes[i];
  const P = new Painter(Math.round(CELL * Q), Q, i * 101 + v * 17 + 3); (SCENES[b.p[0]] || (() => room(P, { wallL: WALL.cream, wallR: WALL.cream, floor: WOOD })))(P, v);
  b.v[v] = press(P); if (v === 0) b.born = performance.now(); baked++; setTimeout(bakeNext, 0); }
setTimeout(bakeNext, 30);

// ---------- view: fit, pan with inertia, zoom on the cursor, tour ----------
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, dpr, view = { x: SW / 2, y: SH / 2, z: .2 }, vel = [0, 0], drag = null, lastInput = -1e9, anim = null, tourI = -1, tourT = 0;
const fitZ = () => Math.min(W / SW, H / SH) * .96;
function resize(){ dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; if (!anim && tourI < 0) view = { x: SW / 2, y: SH / 2, z: fitZ() }; }
addEventListener('resize', resize); resize();
const now = () => performance.now(), touch = () => { lastInput = now(); anim = null; };
function flyTo(x, y, z, ms = 1600){ anim = { from: { ...view }, to: { x, y, z }, t0: now(), ms }; }
const boxZ = () => Math.min(W, H) / CELL * .86;
cv.addEventListener('pointerdown', e => { touch(); drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); vel = [0, 0]; });
cv.addEventListener('pointermove', e => { if (!drag || pinch.size > 1) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; view.x -= dx / view.z; view.y -= dy / view.z; vel = [dx, dy]; drag.x = e.clientX; drag.y = e.clientY; });
addEventListener('pointerup', () => { drag = null; cv.classList.remove('drag'); });
const zoomAt = (sx, sy, f) => { const wx = view.x + (sx - W / 2) / view.z, wy = view.y + (sy - H / 2) / view.z; view.z = Math.max(fitZ() * .6, Math.min(6, view.z * f)); view.x = wx - (sx - W / 2) / view.z; view.y = wy - (sy - H / 2) / view.z; };
cv.addEventListener('wheel', e => { e.preventDefault(); touch(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0015)); }, { passive: false });
const pinch = new Map(); let pinchD = 0;
cv.addEventListener('pointerdown', e => { pinch.set(e.pointerId, [e.clientX, e.clientY]); });
cv.addEventListener('pointermove', e => { if (!pinch.has(e.pointerId)) return; pinch.set(e.pointerId, [e.clientX, e.clientY]); if (pinch.size === 2) { const [a, b] = [...pinch.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinchD) zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / pinchD); pinchD = d; touch(); } });
addEventListener('pointerup', e => { pinch.delete(e.pointerId); pinchD = 0; });
cv.addEventListener('dblclick', e => { touch(); const wx = view.x + (e.clientX - W / 2) / view.z, wy = view.y + (e.clientY - H / 2) / view.z; const b = boxes.find(b => wx > b.x && wx < b.x + CELL && wy > b.y && wy < b.y + CELL); if (b) flyTo(b.x + CELL / 2, b.y + CELL / 2, boxZ(), 1200); });
addEventListener('keydown', e => { touch(); const step = 120 / view.z; if (e.key === 'ArrowLeft') view.x -= step; if (e.key === 'ArrowRight') view.x += step; if (e.key === 'ArrowUp') view.y -= step; if (e.key === 'ArrowDown') view.y += step;
  if (e.key === '+' || e.key === '=') zoomAt(W / 2, H / 2, 1.25); if (e.key === '-') zoomAt(W / 2, H / 2, .8); if (e.key === '0') flyTo(SW / 2, SH / 2, fitZ(), 900); });

const ck = document.getElementById('ck'), cn = document.getElementById('cn'), cl = document.getElementById('cl'); let cardFor = -2;
function card(i){ if (i === cardFor) return; cardFor = i; if (i < 0) { ck.textContent = 'KiarashFa'; cn.textContent = 'Everything Kia has made, printed on one sheet.'; cl.textContent = 'Drag, scroll or pinch to look closer. Double-click a room to visit it.'; return; }
  const p = PROJECTS[i]; ck.textContent = p[2]; cn.textContent = p[1]; cl.textContent = p[3]; }
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const startAt = location.hash ? +(location.hash.slice(1)) : -1;
function frame(){
  const t = now();
  if (anim) { const k = Math.min(1, (t - anim.t0) / anim.ms), e = ease(k); view = { x: anim.from.x + (anim.to.x - anim.from.x) * e, y: anim.from.y + (anim.to.y - anim.from.y) * e, z: anim.from.z * Math.pow(anim.to.z / anim.from.z, e) }; if (k >= 1) anim = null; }
  else if (!drag) { view.x -= vel[0] / view.z; view.y -= vel[1] / view.z; vel = [vel[0] * .92, vel[1] * .92]; }
  // tour: after the sheet has printed, visit each room in order; any input pauses it
  const printed = baked >= boxes.length;
  if (startAt >= 0 && printed && tourI < 0) { tourI = startAt; view = { x: boxes[startAt].x + CELL / 2, y: boxes[startAt].y + CELL / 2, z: boxZ() }; tourT = t; }
  if (printed && !reduce && t - lastInput > 7000 && !anim && (tourI < 0 ? t - boxes[boxes.length - 1].born > 2500 : t - tourT > 5200)) { tourI = (tourI + 1) % boxes.length; const b = boxes[tourI]; flyTo(b.x + CELL / 2, b.y + CELL / 2, boxZ(), 2200); tourT = t + 2200; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#e9e1cd'; g.fillRect(0, 0, W, H);
  g.setTransform(view.z * dpr, 0, 0, view.z * dpr, (W / 2 - view.x * view.z) * dpr, (H / 2 - view.y * view.z) * dpr);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.shadowColor = 'rgba(60,50,30,.18)'; g.shadowBlur = 40; g.drawImage(sheet, 0, 0, SW, SH); g.shadowBlur = 0;
  const boil = reduce ? 0 : Math.floor(t / 333) % 3;
  boxes.forEach(b => { const img = b.v[boil] || b.v[0]; if (!img) return; const k = Math.min(1, (t - b.born) / 700);
    g.save(); g.beginPath(); g.rect(b.x, b.y, CELL, CELL * ease(k)); g.clip(); g.drawImage(img, b.x, b.y, CELL, CELL); g.restore(); });
  // the chapter card follows whichever room fills the view
  if (view.z > fitZ() * 1.8) { const b = boxes.findIndex(b => view.x > b.x - GUT / 2 && view.x < b.x + CELL + GUT / 2 && view.y > b.y - GUT / 2 && view.y < b.y + CELL + GUT / 2); card(b); } else card(-1);
  window.__frames = (window.__frames || 0) + 1; window.__baked = baked;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
