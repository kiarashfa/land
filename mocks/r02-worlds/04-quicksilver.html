<script type="module">
import { PROJECTS } from './_data.js';
// Curated sequence for the mock: the flagships, each modelled as a signed distance field.
const ORDER = ['markey', 'armag', 'galerium', 'lalista', 'polymeratlas', 'exir', 'xefy', 'drxrates'];
const SHAPE = { exir: 0, xefy: 1, markey: 2, armag: 3, polymeratlas: 4, galerium: 5, lalista: 6, drxrates: 7 };

const cv = document.getElementById('gl'), gl = cv.getContext('webgl2', { antialias: false });
const VS = `#version 300 es

const FS = `#version 300 es
precision highp float; out vec4 o;
uniform vec2 uRes; uniform float uT, uMix, uSplit, uRot, uWob; uniform int uShape; uniform vec3 uTint; uniform vec2 uCam;
#define PI 3.14159265
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b-a)/k, 0., 1.); return mix(b, a, h) - k*h*(1.-h); }

  if (s == 1) { // Xefy: a cloche lifting from its plate
    float plate = sdCyl(p - vec3(0., -.55, 0.), .018, .66) - .012;
    vec3 q = p - vec3(-.05, -.36, -.02); q.yz = rot(.38) * q.yz; q.xy = rot(-.12) * q.xy;
    float dome = max(abs(length(q*vec3(1., 1.1, 1.)) - .48) - .022, -q.y); float knob = length(q - vec3(0., .5, 0.)) - .065;

  if (s == 3) { // ARMAG: a cartridge
    float rim = sdCyl(p - vec3(0., -.74, 0.), .03, .17); float body = sdCyl(p - vec3(0., -.2, 0.), .5, .165) - .01;
    float groove = sdTorus(p - vec3(0., -.68, 0.), .17, .025);
    float shoulder = sdCone(p - vec3(0., .37, 0.), .07, .165, .105); float neck = sdCyl(p - vec3(0., .5, 0.), .08, .105);
    vec3 b = p - vec3(0., .58, 0.); float bullet = sdCone(b - vec3(0., .14, 0.), .14, .102, .0) - .01;
    return smin(smin(max(min(rim, body), -groove), smin(shoulder, neck, .03), .04), bullet, .02); }
  if (s == 4) { // PolymerAtlas: an armillary globe on a stand
    vec3 q = p - vec3(0., .12, 0.); q.xy = rot(.41) * q.xy;

  if (s == 5) { // Galerium: an arch with open leaves

    float hole = min(sdBox(q - vec3(0., -.28, 0.), vec3(.28, .4, .2)), sdCylZ(q - vec3(0., .12, 0.), .2, .28));
    float arch = max(frame, -hole); float base = sdRBox(p - vec3(0., -.78, 0.), vec3(.66, .04, .26), .015);

    float qd = length(p - vec3(.2, .62, 0.)) - .085; float stem = sdCap(p, vec3(.2, .43, 0.), vec3(.2, .2, 0.), .07);
    vec3 a = p - vec3(.2, -.07, 0.); a.xy = rot(-2.4) * a.xy; float hook = sdArc(a, vec2(sin(2.3), cos(2.3)), .27, .07);
    float base = sdRBox(p - vec3(-.02, -.78, 0.), vec3(.6, .04, .22), .015);
    return min(min(ex, base), min(qd, smin(stem, hook, .05))); }
  // 7, DrXRates: a film reel
  vec3 q = p - vec3(0., .02, 0.); float disc = sdCylZ(q, .04, .62) - .01;
  float holes = 1e3; for (int i = 0; i < 6; i++) { float a = float(i)/6.*2.*PI + .3; holes = min(holes, sdCylZ(q - vec3(cos(a)*.34, sin(a)*.34, 0.), .2, .14)); }
  holes = min(holes, sdCylZ(q, .2, .05));
  float reel = max(disc, -holes); float rimT = max(sdTorus(q.xzy, .6, .03), -1.);
  float stand = sdRBox(p - vec3(0., -.74, 0.), vec3(.2, .07, .16), .02);
  return min(min(reel, rimT), smin(stand, sdCyl(p - vec3(0., -.66, 0.), .1, .03), .03));
}
float drops(vec3 p){
  float w = sin(p.x*5. + uT*1.3)*sin(p.y*6. - uT*1.1)*sin(p.z*5. + uT*.9) * .035 * uWob;
  float a = length(p - vec3(-uSplit, sin(uT*.9)*.06, 0.)) - .34, b = length(p - vec3(uSplit, cos(uT*.8)*.06, 0.)) - .3;
  return smin(a, b, .32) + w; }
float map(vec3 p){
  p.xz = rot(uRot) * p.xz;
  float d = 1e3;
  if (uMix < .999) d = drops(p);
  if (uMix > .001) { float s = shape((p - vec3(0., .14, 0.)) / .8, uShape) * .8; d = mix(d > 999. ? s : d, s, uMix); }
  return d; }
vec3 nrm(vec3 p){ vec2 e = vec2(.0012, -.0012);
  return normalize(e.xyy*map(p+e.xyy) + e.yyx*map(p+e.yyx) + e.yxy*map(p+e.yxy) + e.xxx*map(p+e.xxx)); }
vec3 env(vec3 d){

  c += vec3(1., .97, .93) * smoothstep(.55, .95, y) * 2.2;
  c += vec3(.95,.97,1.) * smoothstep(.5, .9, d.z) * smoothstep(-.25,.45,y) * 1.7;
  c += vec3(1.) * smoothstep(.97, .995, abs(sin(atan(d.z, d.x) * 3.))) * smoothstep(.0, .5, y) * .9;
  float ang = atan(d.z, d.x);
  c += vec3(.85,.92,1.) * smoothstep(.8, .97, -d.x) * smoothstep(-.4,.0,y) * smoothstep(.85,.25,y) * 1.5;
  c += vec3(1.,.88,.74) * smoothstep(.86, .99, d.x) * smoothstep(-.3,.0,y) * smoothstep(.7,.2,y) * 1.1;
  c += vec3(.9) * smoothstep(.93, .99, -d.z) * smoothstep(.0,.3,y) * .6;

float march(vec3 ro, vec3 rd, float maxd, out float steps){ float t = 0.; steps = 0.;
  for (int i = 0; i < 110; i++) { vec3 p = ro + rd*t; float d = map(p); if (d < .0012 || t > maxd) break; t += d * .8; steps += 1.; }
  return t; }
vec3 metal(vec3 p, vec3 rd){ vec3 n = nrm(p); vec3 r = reflect(rd, n); float fr = pow(1. - max(dot(n, -rd), 0.), 5.);
  vec3 col = env(r) * mix(vec3(.82), uTint, .22) * (.62 + .38*fr);

void main(){
  vec2 uv = (gl_FragCoord.xy - .5*uRes) / uRes.y;
  vec3 ro = vec3(uCam.x*.6, .5 + uCam.y*.25, 4.7), ta = vec3(0., -.05, 0.);

  vec3 col;
  float floorY = -.82;
  float tf = (floorY - ro.y) / rd.y;
  if (t < 8. && (tf < 0. || t < tf)) col = metal(ro + rd*t, rd);
  else if (tf > 0.) {
    vec3 p = ro + rd*tf; vec3 rr = reflect(rd, vec3(0.,1.,0.));
    float s2; float t2 = march(p + rr*.01, rr, 4., s2);
    vec3 refl = t2 < 4. ? metal(p + rr*(t2 + .01), rr) : env(rr) * .4;
    float fres = .18 + .6*pow(1. - abs(rd.y), 4.);
    float sh = 1.; float k = .02; for (int i = 0; i < 24; i++) { float h = map(p + vec3(0.,1.,0.)*k); sh = min(sh, 9.*h/k); k += clamp(h, .02, .2); if (h < .001 || k > 2.) break; }
    float ao = clamp(map(p + vec3(0., .25, 0.)) / .25, 0., 1.);
    col = vec3(.014) + refl * fres * .7; col *= mix(.35, 1., clamp(sh, 0., 1.)) * mix(.4, 1., ao);

  col = col / (1. + col); col = pow(col, vec3(.85));
  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.98, 78.23)) + uT) * 43758.5) - .5) * .02;
  o = vec4(col, 1.);
}`;
function sh(t, s){ const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(x)); return x; }

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(pr, n);

// UI
const idx = document.getElementById('idx'), ra = document.getElementById('ra'), rb = document.getElementById('rb');
const nm = document.getElementById('nm'), eq = document.getElementById('eq'), ln = document.getElementById('ln'), nameEl = document.getElementById('name');
const btns = SEQ.map((p, i) => { const b = document.createElement('button'); b.textContent = p.name; b.onclick = () => { target = i + .45; idle = 0; }; idx.appendChild(b); return b; });
let shownName = -1;
function label(i){ if (i === shownName) return; shownName = i; const p = SEQ[i];
  nm.textContent = p.name; eq.textContent = p.roots ? `${p.roots[0]} + ${p.roots[1]}` : ''; ln.textContent = p.line; btns.forEach((b, k) => b.classList.toggle('on', k === i));
  ra.textContent = p.roots ? p.roots[0] : ''; rb.textContent = p.roots ? p.roots[1] : ''; }

let target = .45, pos = .45, idle = 0;
const hashStart = +(location.hash.slice(1)); if (hashStart >= 0 && location.hash) target = pos = hashStart;
addEventListener('wheel', e => { target += e.deltaY * .0009; idle = 0; }, { passive: true });
let ty = null; addEventListener('pointerdown', e => ty = e.clientY); addEventListener('pointerup', () => ty = null);
let cam = [0, 0];
addEventListener('pointermove', e => { cam = [e.clientX / innerWidth - .5, .5 - e.clientY / innerHeight]; if (ty !== null && e.pointerType !== 'mouse') { target -= (e.clientY - ty) * .003; ty = e.clientY; idle = 0; } });
const ease = x => x * x * (3 - 2 * x), clamp = (x, a, b) => Math.max(a, Math.min(b, x));
let dpr = 1;
function resize(){ dpr = Math.min(devicePixelRatio, innerWidth < 760 ? 1 : 1.5); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
addEventListener('resize', resize); resize();
// the same camera as the shader, so the word labels can ride the droplets
function project(x, y, z){ const ro = [cam[0] * .6, .5 + cam[1] * .25, 4.7], ta = [0, -.05, 0];
  const f = norm(sub(ta, ro)), r = norm(cross(f, [0, 1, 0])), u = cross(r, f), rel = sub([x, y, z], ro), d = dot(rel, f);
  const sx = dot(rel, r) * 1.8 / d, sy = dot(rel, u) * 1.8 / d; return [sx * innerHeight + innerWidth / 2, innerHeight / 2 - sy * innerHeight]; }

const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), rotA = 0;
function frame(now){
